name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels a build that has not deployed yet.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The full history gives each page its "Last updated" date.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build fails on a broken internal link (starlight-links-validator).
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
